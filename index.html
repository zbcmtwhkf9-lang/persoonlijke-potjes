<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7659d6">
  <title>Muntjes Meter</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#242039;background:linear-gradient(145deg,#fff8df 0%,#f4edff 52%,#eaf7ff 100%);color-scheme:light}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:20px}.app{width:min(100%,470px);background:#fff;border:1px solid #eee8f7;border-radius:26px;padding:24px;box-shadow:0 20px 60px rgba(72,52,128,.16)}
    header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:24px;padding:17px;border-radius:18px;background:linear-gradient(120deg,#f1ebff,#fff6dc)}h1{font-size:22px;margin:0 0 4px;font-weight:750}.pot-name{font-size:16px;font-weight:700;color:#6245b4;margin:7px 0 3px}.period{font-size:13px;color:#746c87}.person{background:#fff;color:#6245b4;border:1px solid #e7dcff;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:650}
    .label{font-size:14px;color:#746c87}.amount{font-size:42px;line-height:1.1;font-weight:750;letter-spacing:-.045em;margin:4px 0 18px;font-variant-numeric:tabular-nums;color:#49378b}.bar{height:15px;background:#e7f4e9;border-radius:999px;overflow:hidden;transition:background-color .4s ease}.fill{height:100%;width:100%;background:#24a148;border-radius:inherit;transition:width .4s ease,background-color .4s ease}.bar-labels{display:flex;justify-content:space-between;margin-top:7px;font-size:12px;color:#7a8792;font-variant-numeric:tabular-nums}
    .summary{display:flex;justify-content:space-between;margin:20px 0 10px;padding:14px 0;border-block:1px solid #eee8f7}.summary strong{display:block;margin-top:3px;font-variant-numeric:tabular-nums}.summary div:last-child{text-align:right}
    form{display:flex;gap:9px;margin-top:18px}#setup-form{display:block}input{min-width:0;flex:1;height:48px;border:1px solid #d8d1e6;border-radius:12px;padding:0 14px;font:inherit;font-size:16px;background:#fff}input:focus{outline:3px solid rgba(119,87,217,.22);border-color:#7757d9}button{border:0;border-radius:12px;font:inherit;font-weight:650;min-height:48px}.add{padding:0 17px;background:linear-gradient(110deg,#7657d8,#5b83e6);color:#fff;box-shadow:0 5px 12px rgba(92,74,177,.2)}.message{min-height:20px;margin:8px 0 0;font-size:13px;color:#b33a3a}
    .history{margin-top:12px}.empty{padding:14px 0;color:#7a8792;font-size:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #eee8f7}.row time{font-size:13px;color:#7a8792}.row-main{display:flex;align-items:baseline;gap:9px}.row strong{font-variant-numeric:tabular-nums}.delete{width:42px;color:#7a8792;background:transparent;font-size:20px}.invalid{text-align:center}.invalid h1{margin-bottom:8px}.invalid p{color:#687786;margin:0}.setup-title{margin:0 0 6px;font-size:22px}.setup-copy{color:#687786;font-size:14px;margin:0 0 20px}.fields{display:grid;gap:14px}.fields label{display:grid;gap:6px;color:#687786;font-size:14px}.fields input{width:100%}.settings{margin-top:12px;background:transparent;color:#6245b4;padding:6px 0;font-size:14px}.days{font-size:14px;color:#746c87;margin:12px 0 0}.days strong{color:#242039}.pot-controls{display:flex;gap:9px;margin:-12px 0 22px}.pot-controls select{min-width:0;flex:1;height:44px;border:1px solid #d8d1e6;border-radius:12px;background:white;padding:0 12px;font:inherit}.small-button{background:#fff3cf;color:#795500;padding:0 13px;min-height:44px}.danger-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding-top:12px;border-top:1px solid #eee8f7}.danger{background:#fff0f0;color:#a83245;padding:0 12px;min-height:40px;font-size:13px}
    #form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;margin-top:18px}#amount{grid-column:1;grid-row:1}#description{grid-column:1/-1;grid-row:2}.expense-description{display:block;margin-top:3px;color:#746c87;font-size:13px}.expense-info{min-width:0;display:grid;gap:2px}.row-main{align-items:start;flex:1}.expense-topline{display:flex;align-items:baseline;gap:9px}
    @media(max-width:390px){.app{padding:20px;border-radius:20px}.amount{font-size:38px}}
  </style>
</head>
<body>
  <main class="app" id="app" hidden>
    <section id="setup-view" hidden>
      <h1 class="setup-title" id="setup-title">💰 Muntjes Meter</h1><p class="setup-copy">Maak een potje met een naam, budget en periode.</p>
      <form id="setup-form"><div class="fields"><label for="name-input">🏷️ Naam van het potje<input id="name-input" type="text" maxlength="32" placeholder="Bijvoorbeeld boodschappen" required></label><label for="budget-input">🪙 Budget in euro<input id="budget-input" type="number" min="0.01" step="0.01" inputmode="decimal" required></label><label for="start-input">🚦 Begindatum<input id="start-input" type="date" required></label><label for="end-input">🏁 Einddatum<input id="end-input" type="date" required></label></div><button class="add" type="submit" style="width:100%;margin-top:16px">Opslaan en beginnen</button></form>
      <p class="message" id="setup-message" role="alert"></p>
    </section>
    <section id="tracker-view" hidden>
      <header><div><h1>💰 Muntjes Meter</h1><div class="pot-name" id="pot-title"></div><div class="period" id="period"></div></div><span class="person" id="person"></span></header>
      <div class="pot-controls"><select id="pot-select" aria-label="Kies een potje"></select><button class="small-button" id="add-pot" type="button">➕ Potje</button></div>
      <div class="label">🪙 Nog te besteden</div><div class="amount" id="remaining" aria-live="polite">€ 200,00</div>
      <div class="bar" role="progressbar" aria-label="Resterend budget" aria-valuemin="0"><div class="fill" id="fill"></div></div>
      <div class="bar-labels"><span>€ 0</span><span id="budget-label">€ 200</span></div>
      <div class="summary"><div><span class="label">💸 Uitgegeven</span><strong id="spent">€ 0,00</strong></div><div><span class="label">🧾 Uitgaven</span><strong id="count">0</strong></div></div>
      <p class="days" id="days-left"></p>
      <form id="form"><input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="Bedrag in €" aria-label="Uitgavebedrag" required><input id="description" type="text" maxlength="60" placeholder="Korte omschrijving (optioneel)" aria-label="Korte omschrijving van de uitgave"><button class="add" type="submit">💸 Toevoegen</button></form>
      <p class="message" id="message" role="alert"></p><section class="history" id="history" aria-label="Uitgaven"></section>
      <button class="settings" id="edit-settings" type="button">⚙️ Potje aanpassen</button>
      <div class="danger-actions"><button class="danger" id="delete-pot" type="button">🗑️ Verwijder dit potje</button><button class="danger" id="reset-account" type="button">♻️ Wis al mijn potjes</button></div>
    </section>
  </main>
  <main class="app invalid" id="invalid" hidden><h1>Deze link klopt niet</h1><p>Open je persoonlijke potjeslink opnieuw.</p></main>
  <script>
    (()=>{
      const profiles={
        't-7q4m2x9k':{name:'Tijmen'},
        'g-8v3p6n1r':{name:'Gerrieke'}
      };
      const token=new URLSearchParams(location.search).get('p');
      const profile=profiles[token];
      if(!profile){document.getElementById('invalid').hidden=false;return}
      const app=document.getElementById('app');app.hidden=false;document.getElementById('person').textContent=profile.name;document.title=`Muntjes Meter · ${profile.name}`;
      const key=`potjes-${token}`;let pots=[];let activeId=null;let editId=null;
      try{const stored=JSON.parse(localStorage.getItem(key));if(stored&&Array.isArray(stored.pots)){pots=stored.pots.filter(p=>p&&typeof p.id==='string'&&typeof p.name==='string'&&Number.isFinite(p.budget)&&p.budget>0&&/^\d{4}-\d{2}-\d{2}$/.test(p.endDate)&&Array.isArray(p.entries)).map(p=>({...p,startDate:/^\d{4}-\d{2}-\d{2}$/.test(p.startDate)?p.startDate:'2026-10-24'}));activeId=stored.activeId}}catch(e){}
      const euro=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(n);
      const date=d=>new Intl.DateTimeFormat('nl-NL',{day:'numeric',month:'short'}).format(new Date(d));
      const formatDate=d=>new Intl.DateTimeFormat('nl-NL',{day:'numeric',month:'long',year:'numeric'}).format(new Date(`${d}T12:00:00`));
      const save=()=>localStorage.setItem(key,JSON.stringify({pots,activeId}));
      const setup=document.getElementById('setup-view');const tracker=document.getElementById('tracker-view');
      function showSetup(id=null){editId=id;setup.hidden=false;tracker.hidden=true;const pot=pots.find(p=>p.id===id);document.getElementById('setup-title').textContent=pot?'⚙️ Potje aanpassen':pots.length?'✨ Nieuw potje':'💰 Muntjes Meter';document.getElementById('name-input').value=pot?.name??'';document.getElementById('budget-input').value=pot?.budget??200;document.getElementById('start-input').value=pot?.startDate??'2026-10-24';document.getElementById('end-input').value=pot?.endDate??'2026-11-25';document.querySelector('#setup-form .add').textContent=pot?'Wijzigingen opslaan':pots.length?'Potje toevoegen':'Opslaan en beginnen'}
      function render(){
        if(!pots.length){showSetup();return}const active=pots.find(p=>p.id===activeId)||pots[0];activeId=active.id;setup.hidden=true;tracker.hidden=false;
        const activeName=active.name.trim()||`Potje ${pots.indexOf(active)+1}`;document.getElementById('pot-title').textContent=`🪙 ${activeName}`;const select=document.getElementById('pot-select');select.replaceChildren();pots.forEach((p,index)=>{const option=document.createElement('option');option.value=p.id;option.textContent=p.name.trim()||`Potje ${index+1}`;select.append(option)});select.value=active.id;
        const spent=Math.round(active.entries.reduce((s,e)=>s+e.amount,0)*100)/100;const remaining=Math.round((active.budget-spent)*100)/100;const pct=Math.max(0,Math.min(100,remaining/active.budget*100));
        document.getElementById('remaining').textContent=euro(remaining);document.getElementById('spent').textContent=euro(spent);document.getElementById('count').textContent=active.entries.length;
        const spendRatio=Math.max(0,Math.min(1,spent/active.budget));const hue=Math.round(120*(1-spendRatio));const fill=document.getElementById('fill');const bar=document.querySelector('.bar');fill.style.width=`${pct}%`;fill.style.backgroundColor=`hsl(${hue} 72% 43%)`;bar.style.backgroundColor=`hsl(${hue} 65% 92%)`;bar.setAttribute('aria-valuemax',active.budget);bar.setAttribute('aria-valuenow',Math.max(0,remaining));document.getElementById('budget-label').textContent=euro(active.budget);document.getElementById('period').textContent=`📅 ${formatDate(active.startDate)} – ${formatDate(active.endDate)}`;
        const now=new Date();const todayKey=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;const days=(Date.parse(`${active.endDate}T00:00:00Z`)-Date.parse(`${todayKey}T00:00:00Z`))/86400000;document.getElementById('days-left').innerHTML=days<0?`⌛ Periode is <strong>${Math.abs(days)} ${Math.abs(days)===1?'dag':'dagen'}</strong> geleden geëindigd.`:days===0?'🏁 Deze periode eindigt vandaag.':`⏳ Nog <strong>${days} ${days===1?'dag':'dagen'}</strong> tot de einddatum.`;
        const history=document.getElementById('history');history.replaceChildren();
        if(!active.entries.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Nog geen uitgaven';history.append(empty)}
        [...active.entries].reverse().forEach(entry=>{const row=document.createElement('div');row.className='row';const main=document.createElement('div');main.className='row-main';const info=document.createElement('div');info.className='expense-info';const top=document.createElement('div');top.className='expense-topline';const value=document.createElement('strong');value.textContent=`− ${euro(entry.amount)}`;const time=document.createElement('time');time.dateTime=entry.createdAt;time.textContent=date(entry.createdAt);top.append(value,time);info.append(top);if(entry.description){const description=document.createElement('span');description.className='expense-description';description.textContent=entry.description;info.append(description)}const remove=document.createElement('button');remove.type='button';remove.className='delete';remove.setAttribute('aria-label',`Verwijder uitgave van ${euro(entry.amount)}`);remove.textContent='×';remove.addEventListener('click',()=>{active.entries=active.entries.filter(e=>e.id!==entry.id);save();render()});main.append(info);row.append(main,remove);history.append(row)});
      }
      document.getElementById('setup-form').addEventListener('submit',event=>{event.preventDefault();const name=document.getElementById('name-input').value.trim();const budget=Math.round(Number(document.getElementById('budget-input').value)*100)/100;const startDate=document.getElementById('start-input').value;const endDate=document.getElementById('end-input').value;const message=document.getElementById('setup-message');if(!name||!Number.isFinite(budget)||budget<=0||!startDate||!endDate){message.textContent='Vul een naam, geldig budget en beide datums in.';return}if(startDate>endDate){message.textContent='De begindatum moet vóór of op de einddatum liggen.';return}if(editId){const pot=pots.find(p=>p.id===editId);Object.assign(pot,{name,budget,startDate,endDate})}else{const pot={id:crypto.randomUUID(),name,budget,startDate,endDate,entries:[]};pots.push(pot);activeId=pot.id}try{save();message.textContent=''}catch(e){message.textContent='Potje kon niet worden opgeslagen.';return}render()});
      document.getElementById('edit-settings').addEventListener('click',()=>showSetup(activeId));
      document.getElementById('add-pot').addEventListener('click',()=>showSetup());
      document.getElementById('pot-select').addEventListener('change',event=>{activeId=event.target.value;save();render()});
      document.getElementById('delete-pot').addEventListener('click',()=>{const active=pots.find(p=>p.id===activeId);if(!active||!confirm(`Potje “${active.name}” met alle uitgaven verwijderen?`))return;pots=pots.filter(p=>p.id!==activeId);activeId=pots[0]?.id??null;save();render()});
      document.getElementById('reset-account').addEventListener('click',()=>{if(!confirm('Alle potjes en uitgaven van deze persoonlijke link wissen? Dit kan niet ongedaan worden gemaakt.'))return;localStorage.removeItem(key);pots=[];activeId=null;render()});
      document.getElementById('form').addEventListener('submit',event=>{event.preventDefault();const input=document.getElementById('amount');const descriptionInput=document.getElementById('description');const message=document.getElementById('message');const amount=Math.round(Number(input.value)*100)/100;if(!Number.isFinite(amount)||amount<=0){message.textContent='Vul een geldig bedrag in.';return}const active=pots.find(p=>p.id===activeId);active.entries.push({id:crypto.randomUUID(),amount,description:descriptionInput.value.trim(),createdAt:new Date().toISOString()});try{save();message.textContent=''}catch(e){message.textContent='Opslaan lukte niet op dit apparaat.'}input.value='';descriptionInput.value='';render();input.focus()});
      render();
    })();
  </script>
</body>
</html>
